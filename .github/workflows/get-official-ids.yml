name: Read official DOORS badge IDs
on:
  push:
    paths:
      - '.github/workflows/get-official-ids.yml'
  workflow_dispatch:
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: Read Module BadgeData from official wiki
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://doorsgame.wiki/wiki/Module:BadgeData?action=raw'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          for name in ['Improvise','Playtime','Trade Offer','Rock Bottom','Rocky Road','A Hard Place']:
              print('\n###',name)
              for m in re.finditer(re.escape(name),text,re.I):
                  print(text[max(0,m.start()-500):m.end()+700])
          PY
